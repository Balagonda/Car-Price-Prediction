<style>
        /* Floating Label Styles */
        .floating-input:focus-within label,
        .floating-input input:not(:placeholder-shown) + label {
            transform: translateY(-120%) scale(0.85);
            color: theme('colors.primary');
        }
        
        /* AutoFill override for cleaner look */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px theme('colors.surface-gray') inset !important;
            -webkit-text-fill-color: theme('colors.on-surface') !important;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex text-on-background font-body-md">
<!-- Split Screen Container -->
<div class="flex w-full min-h-screen">
<!-- Left Side: Image Canvas (Hidden on small screens) -->
<div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-surface-container-high items-center justify-center">
<!-- Overlay for text legibility and brand tint -->
<div class="absolute inset-0 bg-primary/10 mix-blend-multiply z-10"></div>
<div class="absolute inset-0 bg-gradient-to-t from-surface-tint/60 to-transparent z-10"></div>
<img alt="Premium used car showcasing the AutoGreen quality standard" class="absolute inset-0 w-full h-full object-cover z-0" src="https://lh3.googleusercontent.com/aida/AP1WRLuCC2q9yQ10knXK66lx9VxmrVchoFYML5WdlRbRYCTo4LFUdmRapiEA0uwHhBap6dROtLHoJ6UcrLHf_elrAj4JIL_buhgyhsFhpAH8b6Toy841Wrarmvje5FScC1G1piq00gSjWODNOISNMQf_vlBKABySOigAFGS5ieT6PetaOCo2nl9je-w15iOK-eR6vNaDDWGTXxe8SxxokLUbMHio1FdE-IqZJw_Wj7SG0P8Ckvmo-jU08LTKcRY"/>
<div class="relative z-20 p-margin-desktop text-on-primary text-center max-w-lg mt-auto pb-32">
<div class="mb-gutter flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-display-lg" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-headline-lg text-headline-lg">AutoGreen</span>
</div>
<h2 class="font-headline-md text-headline-md mb-base">Sustainable Rides, Transparent Deals.</h2>
<p class="font-body-lg text-body-lg text-surface-container-low/90">Join the premium marketplace for eco-conscious and verified vehicles.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex flex-col justify-center px-margin-mobile sm:px-gutter lg:px-margin-desktop bg-surface-gray py-12 lg:py-0 overflow-y-auto">
<div class="w-full max-w-md mx-auto">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="lg:hidden mb-12 flex items-center justify-center gap-2 text-primary">
<span class="material-symbols-outlined text-headline-lg-mobile" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold tracking-tight">AutoGreen</span>
</div>
<!-- Header -->
<div class="mb-10 text-center lg:text-left">
<h1 class="font-headline-lg text-headline-lg-mobile lg:text-headline-lg text-on-surface mb-2 tracking-tight">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Social Logins -->
<div class="flex flex-col sm:flex-row gap-4 mb-8">
<button class="flex-1 flex items-center justify-center gap-3 py-3 px-4 bg-surface rounded-lg border border-outline-variant hover:bg-mint-soft hover:border-primary-container transition-colors duration-200 group shadow-sm">
<svg class="w-5 h-5 text-on-surface" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface group-hover:text-primary transition-colors">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-3 py-3 px-4 bg-surface rounded-lg border border-outline-variant hover:bg-mint-soft hover:border-primary-container transition-colors duration-200 group shadow-sm">
<svg class="w-5 h-5 text-on-surface" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.34-.84 3.73-.77 1.39.06 2.53.64 3.19 1.62-2.7 1.57-2.24 5.39.46 6.54-1.21 2.39-3.22 4.41-5.46 4.78h-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="currentColor"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface group-hover:text-primary transition-colors">Apple</span>
</button>
</div>
<div class="relative flex py-5 items-center mb-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-caption text-caption">Or continue with email</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Input -->
<div class="relative floating-input bg-surface-gray">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-transparent border-0 border-b-2 border-outline-variant appearance-none focus:outline-none focus:ring-0 focus:border-primary peer transition-colors duration-200 rounded-t-sm" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute text-on-surface-variant duration-200 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 peer-focus:text-primary font-body-md text-body-md cursor-text" for="email">Email address</label>
</div>
<!-- Password Input -->
<div class="relative floating-input bg-surface-gray">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-transparent border-0 border-b-2 border-outline-variant appearance-none focus:outline-none focus:ring-0 focus:border-primary peer transition-colors duration-200 rounded-t-sm" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute text-on-surface-variant duration-200 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 peer-focus:text-primary font-body-md text-body-md cursor-text" for="password">Password</label>
<!-- Toggle Password Visibility (Optional JS interaction) -->
<button aria-label="Toggle password visibility" class="absolute right-3 top-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline text-primary focus:ring-primary bg-surface cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-caption text-caption text-on-surface cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200" href="#">
                                Forgot password?
                            </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all duration-200 hover:shadow-[0px_10px_30px_rgba(46,204,113,0.15)] active:scale-[0.98]" type="submit">
                            Sign In
                        </button>
</div>
</form>
<!-- Footer Link -->
<p class="mt-10 text-center font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200 underline underline-offset-4" href="#">Create an account</a>
</p>
</div>
</div>
</div>
</body></html>
