# AutoWorth AI — Ruff linter configuration
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",   # allow assert in tests
    "B008",   # allow function calls in default args (FastAPI Depends)
]

[tool.ruff.per-file-ignores]
"*/alembic/*" = ["E501"]   # Long lines OK in migrations
"*/tests/*" = ["S", "N"]   # Relax security and naming in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
