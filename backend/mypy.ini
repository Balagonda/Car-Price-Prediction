# AutoWorth AI — mypy configuration
[mypy]
python_version = 3.11
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

# SQLAlchemy stubs
plugins = sqlalchemy.ext.mypy.plugin

# Ignore missing stubs for third-party libs without type hints
[mypy-jose.*]
ignore_missing_imports = true

[mypy-passlib.*]
ignore_missing_imports = true

[mypy-cloudinary.*]
ignore_missing_imports = true

[mypy-optuna.*]
ignore_missing_imports = true

[mypy-shap.*]
ignore_missing_imports = true

[mypy-xgboost.*]
ignore_missing_imports = true
